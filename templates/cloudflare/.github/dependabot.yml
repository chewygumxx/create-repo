#
#
# ~chewygumxx/repo-tmpl.git
# ::: :/.github/dependabot.yml
#
#

version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      # A shared-config release bumps several @chewygumxx packages at once;
      # each group opens one pull request, and a major stays on its own.
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      ignore:
          # @cloudflare/vitest-pool-workers peers on Vitest 4.
          - dependency-name: "vitest"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
