#

#
# https://developers.cloudflare.com/workers/wrangler/commands/
#

[dev]
description = "Serve the Worker locally"
run         = "bun run wrangler dev"

[deploy]
description = "Deploy the Worker"
run         = "bun run wrangler deploy"

# hk's types step fails while the file is stale.
[types]
description = "Regenerate worker-configuration.d.ts from wrangler.jsonc"
run         = "bun run wrangler types --include-runtime=false"
