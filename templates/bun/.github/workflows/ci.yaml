#
#
# ~chewygumxx/repo-tmpl.git
# ::: :/.github/workflows/ci.yaml
#
#

# The shared standard checks (commitlint, header sync, generic lint and
# format, metadata sync), then this repository's own `bun run check` against
# the commit the header sync pushed. See chewygumxx/.github for each part.
#
# The metadata sync runs once the METADATA_APP_CLIENT_ID variable is set,
# as create-repo sets it unless told not to; until then it is skipped.
# workflow_dispatch re-runs it once the METADATA_APP_* secret and variable
# are corrected.

name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: read

# Not cancelled in progress: a newer run must not interrupt the header sync
# part-way through its commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    standard:
        uses: chewygumxx/.github/.github/workflows/standard.yaml@v1
        with:
            metadata-sync: ${{ vars.METADATA_APP_CLIENT_ID != '' }}
            metadata-client-id: ${{ vars.METADATA_APP_CLIENT_ID }}
            # `bun run check` lints YAML by the same configurations, so
            # lint-format need not.
            yaml: false
        secrets:
            metadata-private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}

    check:
        needs: standard
        if: ${{ !cancelled() }}
        permissions:
            contents: read
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1
        with:
            ref: ${{ needs.standard.outputs.sha }}
