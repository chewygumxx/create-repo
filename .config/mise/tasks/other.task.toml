# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/create-repo.git
# ::: :/.config/mise/tasks/other.task.toml
#
#

#
# https://mise.jdx.dev/tasks/task-configuration.html
#

[commit]
extends = "cgxx:commit"

["templates:materialize"]
description = "Write every template, as bundled, under .templates/"
run         = "bun scripts/materialize.js --all .templates"

# https://github.com/chewygumxx/.github#readme
[act]
extends = "cgxx:act"
alias   = [
    "exec-ci",
    "exec-gh-act",
    "exec-gh-actions",
]

[act-cached]
description = "[Internal] Run CI locally with act"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"
hide        = true
