name: Sync repository metadata

on:
    push:
        branches:
            - main
        paths:
            - .repo-metadata.jsonc
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    # See the reusable workflow for registering the GitHub App behind these.
    apply:
        uses: chewygumxx/.github/.github/workflows/sync-repo-metadata.yaml@v1
        with:
            client-id: ${{ vars.METADATA_APP_CLIENT_ID }}
        secrets:
            private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}
