#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/dependabot.yml
#
#

version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      ignore:
          # Its majors follow Node's; bumped by hand with the Node floor.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    - package-ecosystem: npm
      directory: /templates/npm
      schedule:
          interval: weekly
      commit-message:
          prefix: build(template)
      ignore:
          # Its majors follow Node's; bumped by hand with the Node floor.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /templates/npm
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(template)

    - package-ecosystem: npm
      directory: /templates/typescript
      schedule:
          interval: weekly
      commit-message:
          prefix: build(template)
      ignore:
          # Its majors follow Node's; bumped by hand with the Node floor.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: npm
      directory: /templates/typescript-publish
      schedule:
          interval: weekly
      commit-message:
          prefix: build(template)
      ignore:
          # Its majors follow Node's; bumped by hand with the Node floor.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /templates/typescript-publish
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(template)

    - package-ecosystem: npm
      directory: /templates/cloudflare
      schedule:
          interval: weekly
      commit-message:
          prefix: build(template)
      ignore:
          # Its majors follow Node's; bumped by hand with the Node floor.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
          # @cloudflare/vitest-pool-workers peers on Vitest 4.
          - dependency-name: "vitest"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /templates/cloudflare
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(template)

    - package-ecosystem: github-actions
      directory: /templates/native
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(template)
