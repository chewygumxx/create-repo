#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/dependabot.yml
#
#

# A shared-config release bumps several @chewygumxx packages at once; in
# each bun directory, each group opens one pull request, and a major stays
# on its own.

version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    # A template's workflows are read from their own directory: Dependabot
    # scans a directory other than `/` itself, not its `.github/workflows`.
    # The prefixes carry no scope because commitlint ignores a Dependabot
    # commit only when its header is an unscoped `build: bump` or `ci: bump`.
    - package-ecosystem: bun
      directory: /templates/bun
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]

    - package-ecosystem: github-actions
      directory: /templates/bun/.github/workflows
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    - package-ecosystem: bun
      directory: /templates/typescript
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]

    - package-ecosystem: bun
      directory: /templates/typescript-publish
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]

    - package-ecosystem: github-actions
      directory: /templates/typescript-publish/.github/workflows
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    - package-ecosystem: bun
      directory: /templates/cloudflare
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          shared-config:
              patterns: ["@chewygumxx/*"]
              update-types: ["minor", "patch"]
          dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      ignore:
          # @cloudflare/vitest-pool-workers peers on Vitest 4.
          - dependency-name: "vitest"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /templates/cloudflare/.github/workflows
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    - package-ecosystem: github-actions
      directory: /templates/native/.github/workflows
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
