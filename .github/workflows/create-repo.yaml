#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/workflows/create-repo.yaml
#
#

# Runs `create-repo --dry-run` on every bundled template and combination of
# its features: copy, install, init, check and commit for real, with
# nothing created on GitHub. Catches a template drifting from lib/init.js
# and from its own checks, though not from its Biome formatting, which the
# run applies before checking; the root `bun run lint:templates` catches
# that. gh is not logged in here, so the dry run reads nothing from GitHub.
# Publish calls it too, so no version is staged whose templates fail their
# own checks.

name: Create Repo

on:
    push:
        branches:
            - main
    pull_request:
    workflow_call: {}
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    matrix:
        runs-on: ubuntu-latest

        outputs:
            matrix: ${{ steps.list.outputs.matrix }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup mise
              uses: jdx/mise-action@v4

            - name: Bun Install
              run: bun install --frozen-lockfile

            - name: List Templates
              id: list
              run: echo "matrix=$(bun scripts/materialize.js --list)" >> "$GITHUB_OUTPUT"

    dry-run:
        needs: matrix
        name: Dry Run (${{ matrix.name }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup mise
              uses: jdx/mise-action@v4

            - name: Bun Install
              run: bun install --frozen-lockfile

            # What a template's checks need and mise does not provide.
            - name: Install System Packages
              if: matrix.template == 'zsh'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends zsh

            - name: Dry Run
              env:
                  GH_TOKEN: ""
                  # mise's github: backend (Neovim, luafmt, shuck) reads release
                  # metadata from the API, which a shared runner is rate
                  # limited on without a token. Not GITHUB_TOKEN: that would
                  # log gh in.
                  MISE_GITHUB_TOKEN: ${{ github.token }}
                  TEMPLATE: ${{ matrix.template }}
                  WITH: ${{ matrix.with }}
              run: |
                  git config --global user.name "create-repo dry run"
                  git config --global user.email "create-repo@users.noreply.github.com"
                  bun bin/create-repo.js dry-run \
                      --template "$TEMPLATE" \
                      --with "$WITH" \
                      --description 'Dry run of "create-repo": a bundled template, initialised and committed.' \
                      --topics ci \
                      --scopes api \
                      --owner example \
                      --dir "$RUNNER_TEMP/dry-run" \
                      --no-metadata \
                      --dry-run \
                      --yes
                  git -C "$RUNNER_TEMP/dry-run" log --format=%B -1
                  if git -C "$RUNNER_TEMP/dry-run" grep -n \
                      -e repo-tmpl -e repo_tmpl -e is_template \
                      -e 'Using this template'; then
                      echo "::error::template identity remains"
                      exit 1
                  fi
