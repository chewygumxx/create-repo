#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/workflows/create-repo.yaml
#
#

# Runs `create-repo --dry-run` on the bundled template: copy, install, init,
# check and commit for real, with nothing created on GitHub. Catches the
# template drifting from lib/init.js and from its own checks. gh is not
# logged in here, so the dry run reads nothing from GitHub. Publish calls it
# too, so no version is staged whose template fails its own checks.

name: Create Repo

on:
    push:
        branches:
            - main
    pull_request:
    workflow_call: {}
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    dry-run:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup mise
              uses: jdx/mise-action@v4

            - name: NPM Clean Install
              run: npm ci

            - name: Dry Run
              env:
                  GH_TOKEN: ""
              run: |
                  git config --global user.name "create-repo dry run"
                  git config --global user.email "create-repo@users.noreply.github.com"
                  node bin/create-repo.js dry-run \
                      --description 'Dry run of "create-repo": the bundled template, initialised and committed.' \
                      --topics ci \
                      --scopes api \
                      --owner example \
                      --dir "$RUNNER_TEMP/dry-run" \
                      --no-metadata \
                      --dry-run \
                      --yes
                  git -C "$RUNNER_TEMP/dry-run" log --format=%B -1
                  if git -C "$RUNNER_TEMP/dry-run" grep -n \
                      -e repo-tmpl -e is_template -e 'Using this template'; then
                      echo "::error::template identity remains"
                      exit 1
                  fi
