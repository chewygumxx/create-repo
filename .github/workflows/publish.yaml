#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/workflows/publish.yaml
#
#

# Publishes the package for each published GitHub release, which
# release-please.yaml makes once its pull request is merged: that merge
# is the maintainer's approval. The release commit must pass lint and a
# dry run of every template first, and its tag must be v<version>.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. The
# package's npm Settings > Trusted Publisher names this repository and
# this workflow's filename, which must not change.

name: Publish

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1
        with:
            ref: ${{ github.sha }}

    dry-run:
        permissions:
            contents: read
        uses: ./.github/workflows/create-repo.yaml

    publish:
        needs: [check, dry-run]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout Release Commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            # npm from Node: Bun cannot publish by trusted publishing. No
            # dependency is installed, so this job, holding the OIDC token,
            # runs no dependency's code.
            - name: Set Up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check Package and Tag
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if ! jq -e --arg tag "$TAG" \
                      '.name == "@chewygumxx/create-repo" and "v\(.version)" == $tag' \
                      package.json >/dev/null; then
                      echo "::error::package.json does not match the tag $TAG"
                      exit 1
                  fi

            - name: Publish with npm Trusted Publishing
              run: npm publish --provenance --ignore-scripts
