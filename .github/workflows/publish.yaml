#
#
# ~chewygumxx/create-repo.git
# ::: :/.github/workflows/publish.yaml
#
#

# Publishes the package for each published GitHub release, which
# release-please.yaml makes once its pull request is merged: that merge
# is the maintainer's approval. The release commit must pass lint and a
# dry run of every template first, and its tag must be v<version>; the
# tarball those dry runs used is what is published.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. The
# package's npm Settings > Trusted Publisher names this repository and
# this workflow's filename, which must not change.

name: Publish

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1
        with:
            ref: ${{ github.sha }}

    dry-run:
        permissions:
            contents: read
        uses: ./.github/workflows/create-repo.yaml

    publish:
        needs: [check, dry-run]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            # The tarball the dry run tested, packed from the release
            # commit, is the one published.
            - name: Download Package
              uses: actions/download-artifact@v8
              with:
                  name: package
                  path: ${{ runner.temp }}/package

            # npm from Node: Bun cannot publish by trusted publishing. No
            # dependency is installed, so this job, holding the OIDC token,
            # runs no dependency's code.
            - name: Set Up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check Package and Tag
              id: package
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -- "$RUNNER_TEMP"/package/*.tgz
                  if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                      echo "::error::Expected one packed tarball"
                      exit 1
                  fi
                  if ! tar -xOzf "$1" package/package.json | jq -e --arg tag "$TAG" \
                      '.name == "@chewygumxx/create-repo" and "v\(.version)" == $tag' >/dev/null; then
                      echo "::error::The packed package.json does not match the tag $TAG"
                      exit 1
                  fi
                  echo "tarball=$1" >> "$GITHUB_OUTPUT"
                  echo "npm $(npm --version), Node $(node --version)"

            - name: Publish with npm Trusted Publishing
              env:
                  TARBALL: ${{ steps.package.outputs.tarball }}
              run: npm publish "$TARBALL" --provenance --ignore-scripts
